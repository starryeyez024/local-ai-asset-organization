pages:
  stage: deploy
  tags:
    - itup-alm-x86
  script:
    - mkdir -p public
    - cp -r pages/. public/
    - mkdir -p public/skills-explorer
    - cp -r skills-explorer/. public/skills-explorer/
    - mkdir -p public/skills
    - cp -r skills/. public/skills/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
