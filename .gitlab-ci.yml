pages:
  stage: deploy
  tags:
    - itup-alm-x86
  script:
    - mkdir -p public
    - cp -r pages/. public/
    - mkdir -p public/skills
    - cp -r skills/. public/skills/
    - mkdir -p public/skills-explorer
    - cp skills-explorer/index.html skills-explorer/about.html skills-explorer/sample-skills.json public/skills-explorer/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
