<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated skills explorer catalog view</title>
  <desc id="desc">A dark skills explorer window with a search field, filters, and three skill cards.</desc>
  <rect width="1200" height="720" rx="18" fill="#eef6ff"/>
  <rect x="34" y="30" width="1132" height="660" rx="14" fill="#151528"/>
  <rect x="34" y="30" width="1132" height="76" rx="14" fill="#24243a"/>
  <circle cx="75" cy="68" r="10" fill="#f56b7a"/><circle cx="108" cy="68" r="10" fill="#ffd27a"/><circle cx="141" cy="68" r="10" fill="#9ad98a"/>
  <text x="184" y="76" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">AI-first Skills Explorer</text>
  <rect x="78" y="138" width="1044" height="58" rx="9" fill="#fff"/>
  <text x="104" y="175" fill="#5f6368" font-family="Arial, sans-serif" font-size="21">Search skills by name, team, or capability…</text>
  <rect x="78" y="220" width="180" height="36" rx="18" fill="#9ad98a"/><text x="101" y="244" fill="#151528" font-family="Arial, sans-serif" font-size="16" font-weight="700">All capabilities</text>
  <rect x="274" y="220" width="150" height="36" rx="18" fill="#3d3d58"/><text x="301" y="244" fill="#e7e7f0" font-family="Arial, sans-serif" font-size="16">Product</text>
  <rect x="440" y="220" width="150" height="36" rx="18" fill="#3d3d58"/><text x="466" y="244" fill="#e7e7f0" font-family="Arial, sans-serif" font-size="16">Program</text>
  <rect x="606" y="220" width="145" height="36" rx="18" fill="#3d3d58"/><text x="633" y="244" fill="#e7e7f0" font-family="Arial, sans-serif" font-size="16">Research</text>
  <text x="78" y="304" fill="#91bdf0" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">12 SKILLS FOUND</text>
  <g fill="#fff">
    <rect x="78" y="330" width="320" height="270" rx="12"/><rect x="440" y="330" width="320" height="270" rx="12"/><rect x="802" y="330" width="320" height="270" rx="12"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="104" y="374" fill="#151528" font-size="22" font-weight="700">ai-asset-auditor</text><text x="104" y="410" fill="#5f6368" font-size="17">Read-first inventory and</text><text x="104" y="437" fill="#5f6368" font-size="17">migration planning.</text><text x="104" y="490" fill="#0066cc" font-size="15" font-weight="700">Product management</text><text x="104" y="550" fill="#2f7a4f" font-size="16">View SKILL.md →</text>
    <text x="466" y="374" fill="#151528" font-size="22" font-weight="700">decision-log</text><text x="466" y="410" fill="#5f6368" font-size="17">Capture durable decisions</text><text x="466" y="437" fill="#5f6368" font-size="17">with a repeatable workflow.</text><text x="466" y="490" fill="#0066cc" font-size="15" font-weight="700">Program management</text><text x="466" y="550" fill="#2f7a4f" font-size="16">View SKILL.md →</text>
    <text x="828" y="374" fill="#151528" font-size="22" font-weight="700">source-review</text><text x="828" y="410" fill="#5f6368" font-size="17">Check claims against</text><text x="828" y="437" fill="#5f6368" font-size="17">authoritative sources.</text><text x="828" y="490" fill="#0066cc" font-size="15" font-weight="700">Research</text><text x="828" y="550" fill="#2f7a4f" font-size="16">View SKILL.md →</text>
