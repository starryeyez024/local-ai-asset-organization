<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXD AI-First Skills Explorer</title>
  <style>
    :root {
      --rh-red: #ee0000;
      --rh-dark: #151515;
      --rh-gray-900: #1a1a1a;
      --rh-gray-700: #3c3f42;
      --rh-gray-500: #6a6e73;
      --rh-gray-300: #d2d2d2;
      --rh-gray-100: #f0f0f0;
      --rh-white: #ffffff;
      --tag-tool: #0066cc;
      --tag-role: #3e8635;
      --tag-task: #c9190b;
      --tag-type: #6753ac;
      --tag-phase: #005f60;
      --tag-stage: #a35a00;
      --tag-tool-bg: #e7f1fa;
      --tag-role-bg: #e9f5e6;
      --tag-task-bg: #fce4e1;
      --tag-type-bg: #f4e6ff;
      --tag-phase-bg: #e0f3f2;
      --tag-stage-bg: #fbead2;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Red Hat Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--rh-gray-100);
      color: var(--rh-dark);
      line-height: 1.5;
    }

    header {
      background: var(--rh-dark);
      color: var(--rh-white);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .header-stats {
      font-size: 13px;
      color: var(--rh-gray-300);
    }

    .header-stats strong { color: var(--rh-white); }

    #search-box {
      margin-left: auto;
      padding: 8px 12px;
      border: 1px solid var(--rh-gray-500);
      border-radius: 4px;
      background: var(--rh-gray-900);
      color: var(--rh-white);
      font-size: 14px;
      width: 260px;
    }

    #search-box::placeholder { color: var(--rh-gray-500); }
    #search-box:focus { outline: 2px solid var(--tag-tool); border-color: var(--tag-tool); }

    .active-filters-bar {
      background: var(--rh-white);
      border-bottom: 1px solid var(--rh-gray-300);
      padding: 8px 24px;
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .active-filters-bar.visible { display: flex; }

    .active-filters-bar .label {
      font-size: 12px;
      color: var(--rh-gray-500);
      margin-right: 4px;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }

    .filter-chip .remove {
      font-weight: bold;
      margin-left: 2px;
    }

    .filter-chip[data-group="tool"] { background: var(--tag-tool-bg); color: var(--tag-tool); }
    .filter-chip[data-group="role"] { background: var(--tag-role-bg); color: var(--tag-role); }
    .filter-chip[data-group="task"] { background: var(--tag-task-bg); color: var(--tag-task); }
    .filter-chip[data-group="type"] { background: var(--tag-type-bg); color: var(--tag-type); }
    .filter-chip[data-group="phase"] { background: var(--tag-phase-bg); color: var(--tag-phase); }
    .filter-chip[data-group="stage"] { background: var(--tag-stage-bg); color: var(--tag-stage); }

    .clear-all-btn {
      background: none;
      border: 1px solid var(--rh-gray-300);
      color: var(--rh-gray-500);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 8px;
    }

    .clear-all-btn:hover { background: var(--rh-gray-100); color: var(--rh-dark); }

    .layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--rh-white);
      border-right: 1px solid var(--rh-gray-300);
      padding: 16px 0;
      overflow-y: auto;
      position: sticky;
      top: 0;
      height: calc(100vh - 64px);
    }

    .filter-group {
      border-bottom: 1px solid var(--rh-gray-100);
      padding: 0 16px;
    }

    .filter-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--rh-gray-700);
    }

    .filter-group-header .arrow {
      transition: transform 0.15s;
      font-size: 10px;
    }

    .filter-group.collapsed .arrow { transform: rotate(-90deg); }
    .filter-group.collapsed .filter-options { display: none; }

    .filter-options {
      padding-bottom: 12px;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      font-size: 13px;
      color: var(--rh-gray-700);
    }

    .filter-option:hover { color: var(--rh-dark); }

    .filter-option input[type="checkbox"] {
      accent-color: var(--tag-tool);
      width: 14px;
      height: 14px;
    }

    .filter-option .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--rh-gray-500);
      background: var(--rh-gray-100);
      padding: 0 6px;
      border-radius: 8px;
    }

    .filter-group[data-group="tool"] input { accent-color: var(--tag-tool); }
    .filter-group[data-group="role"] input { accent-color: var(--tag-role); }
    .filter-group[data-group="task"] input { accent-color: var(--tag-task); }
    .filter-group[data-group="type"] input { accent-color: var(--tag-type); }
    .filter-group[data-group="phase"] input { accent-color: var(--tag-phase); }
    .filter-group[data-group="stage"] input { accent-color: var(--tag-stage); }

    .main {
      flex: 1;
      padding: 20px 24px;
      max-width: 900px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--rh-gray-500);
    }

    .toggle-stubs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--rh-gray-500);
      cursor: pointer;
    }

    .toggle-stubs input { accent-color: var(--rh-gray-500); }

    .skill-card {
      background: var(--rh-white);
      border: 1px solid var(--rh-gray-300);
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .skill-card.stub { opacity: 0.5; }
    .skill-card.hidden { display: none; }

    .skill-card summary {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      list-style: none;
    }

    .summary-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .skill-description-preview {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--rh-gray-500);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .skill-card summary::-webkit-details-marker { display: none; }

    .skill-card summary::before {
      content: "\25B6";
      font-size: 10px;
      color: var(--rh-gray-500);
      transition: transform 0.15s;
      flex-shrink: 0;
    }

    .skill-card[open] summary::before { transform: rotate(90deg); }

    .skill-name {
      font-weight: 600;
      color: var(--rh-dark);
      flex-shrink: 0;
    }

    .skill-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin: 8px 0 4px;
    }

    .tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .tag:hover { opacity: 0.8; }

    .tag.tool { background: var(--tag-tool-bg); color: var(--tag-tool); }
    .tag.role { background: var(--tag-role-bg); color: var(--tag-role); }
    .tag.task { background: var(--tag-task-bg); color: var(--tag-task); }
    .tag.phase { background: var(--tag-phase-bg); color: var(--tag-phase); }
    .tag.stage { background: var(--tag-stage-bg); color: var(--tag-stage); }

    .skill-details {
      padding: 0 16px 16px 32px;
      font-size: 13px;
      color: var(--rh-gray-700);
      line-height: 1.6;
    }

    .skill-details .meta-row {
      display: flex;
      gap: 24px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--rh-gray-500);
    }

    .skill-details .meta-row span { white-space: nowrap; }
    .skill-details .meta-row strong { color: var(--rh-gray-700); }

    .skill-type-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .skill-type-badge.workflow { background: #f4e6ff; color: #6753ac; }
    .skill-type-badge.atomic { background: var(--rh-gray-100); color: var(--rh-gray-500); }

    .how-to-use {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--rh-gray-100);
    }

    .how-to-use h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--rh-gray-500);
      margin-bottom: 6px;
    }

    .how-to-use .block { margin-bottom: 10px; }
    .how-to-use .block:last-child { margin-bottom: 0; }

    .inputs-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .inputs-list li {
      background: #fafafa;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      border: 1px solid var(--rh-gray-300);
      color: var(--rh-gray-500);
    }

    .inputs-list li.required { border: 1px solid var(--rh-dark); color: var(--rh-dark); background: #fafafa; }

    .required-skills-chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }

    .required-skills-chain .step {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .required-skills-chain .step-link {
      background: var(--tag-tool-bg);
      color: var(--tag-tool);
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .required-skills-chain .step-link:hover { text-decoration: underline; }

    .required-skills-chain .arrow-sep { color: var(--rh-gray-300); }

    .source-path {
      font-size: 11px;
      color: var(--rh-gray-500);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--rh-gray-500);
      font-size: 15px;
    }

    /* -- View tabs (Browse / Maintain) -- */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: var(--rh-gray-900);
      border-radius: 6px;
      padding: 3px;
    }

    .view-tab {
      background: none;
      border: none;
      color: var(--rh-gray-300);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .view-tab:hover { color: var(--rh-white); }
    .view-tab.active { background: var(--rh-white); color: var(--rh-dark); }

    .view-tab-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    /* Toggled via classList (not inline styles) so JS can reliably show/hide
       these containers -- setting el.style.display = "" only clears an inline
       override, it does NOT remove a stylesheet rule like this one, so the
       show/hide logic must add/remove this class instead. */
    .view-hidden { display: none; }

    /* -- Maintain toolbar -- */
    .maintain-toolbar {
      background: var(--rh-white);
      border-bottom: 1px solid var(--rh-gray-300);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .maintain-toolbar input[type="text"] {
      padding: 7px 12px;
      border: 1px solid var(--rh-gray-300);
      border-radius: 4px;
      font-size: 13px;
      width: 280px;
    }

    .maintain-toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--rh-gray-700);
      cursor: pointer;
      white-space: nowrap;
    }

    .maintain-toolbar #maintain-results-count {
      margin-left: auto;
      font-size: 13px;
      color: var(--rh-gray-500);
    }

    .maintain-stats {
      display: flex;
      gap: 20px;
      padding: 14px 24px;
      background: var(--rh-white);
      border-bottom: 1px solid var(--rh-gray-300);
      flex-wrap: wrap;
    }

    .maintain-stat {
      font-size: 13px;
      color: var(--rh-gray-500);
    }

    .maintain-stat strong {
      display: block;
      font-size: 20px;
      color: var(--rh-dark);
      font-weight: 600;
    }

    .maintain-stat.stat-broken strong,
    .maintain-stat.stat-stale strong { color: var(--tag-task); }

    .maintain-stat.stat-duplicates strong { color: var(--tag-stage); }

    .maintain-table-wrap {
      padding: 16px 24px 40px;
      /* No overflow-x here on purpose: setting overflow-x to anything but
         "visible" forces the browser to also compute overflow-y as "auto"
         (per spec), which makes this div its own "scroll container" -- even
         though it never actually scrolls internally (content just flows in
         the page). That accidental scroll container was exactly why the
         sticky <th> below wasn't sticking to the real, page-level scroll:
         it was anchored to this div's (non-scrolling) scrollport instead of
         the viewport. table-layout: fixed + word-break on the path column
         already keep row content from overflowing horizontally, so this
         isn't needed for that either. */
    }

    .maintain-path-caption {
      font-size: 12px;
      color: var(--rh-gray-500);
      margin-bottom: 8px;
    }

    .maintain-path-caption code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: var(--rh-gray-100);
      padding: 1px 5px;
      border-radius: 3px;
    }

    #maintain-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--rh-white);
    }

    #maintain-table th {
      text-align: left;
      padding: 10px 12px;
      background: var(--rh-gray-900);
      color: var(--rh-white);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    #maintain-table th[data-sort] {
      cursor: pointer;
      user-select: none;
    }
    #maintain-table th[data-sort]:hover {
      background: var(--rh-gray-700);
    }
    #maintain-table th .sort-arrow {
      font-size: 10px;
      letter-spacing: 0;
    }

    #maintain-table th:nth-child(1), #maintain-table td:nth-child(1) { width: 16%; }
    #maintain-table th:nth-child(2), #maintain-table td:nth-child(2) { width: 50%; }
    #maintain-table th:nth-child(3), #maintain-table td:nth-child(3) { width: 18%; }
    #maintain-table th:nth-child(4), #maintain-table td:nth-child(4) { width: 160px; }

    #maintain-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--rh-gray-100);
      vertical-align: top;
    }

    #maintain-table tr:hover td { background: #fafafa; }

    .maintain-name { font-weight: 600; color: var(--rh-dark); }

    .maintain-path {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--rh-gray-700);
      overflow-wrap: break-word;
      word-break: break-word;
      user-select: all;
    }

    .maintain-date { white-space: nowrap; font-weight: 400; }
    .maintain-date.stale { color: var(--tag-task); }
    .maintain-date.unknown { color: var(--rh-gray-500); font-style: italic; }

    .maintain-days-ago { font-size: 11px; color: var(--rh-gray-500); margin-top: 2px; }
    .maintain-days-ago.stale { color: var(--tag-task); }

    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin: 0 4px 4px 0;
      white-space: nowrap;
    }

    .badge-broken { background: #fce4e1; color: var(--tag-task); }
    .badge-stale { background: #fce4e1; color: var(--tag-task); }
    .badge-duplicate { background: var(--tag-stage-bg); color: var(--tag-stage); cursor: help; }
    .badge-missing { background: var(--rh-gray-100); color: var(--rh-gray-500); }
    .badge-curated { background: var(--tag-role-bg); color: var(--tag-role); }
    .badge-orphaned { background: var(--rh-gray-100); color: var(--rh-gray-500); }
    .badge-realdir { background: var(--rh-gray-100); color: var(--rh-gray-500); }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        min-width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--rh-gray-300);
      }
      #search-box { width: 100%; margin-left: 0; margin-top: 8px; }
      .main { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>IXD AI-First Skills Explorer</h1>
  <span class="header-stats" id="header-stats"></span>
  <div class="view-tabs" id="view-tabs">
    <button class="view-tab active" data-view="browse">Browse Skills</button>
    <button class="view-tab" data-view="maintain">Maintain Skills</button>
    <a class="view-tab view-tab-link" href="how-to-update.html">About</a>
  </div>
  <input type="text" id="search-box" placeholder="Search skills by name or description...">
</header>

<div id="browse-view">
  <div class="active-filters-bar" id="active-filters-bar">
    <span class="label">Active filters:</span>
    <div id="filter-chips"></div>
    <button class="clear-all-btn" id="clear-all-btn">Clear all</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="results-header">
        <span id="results-count"></span>
        <label class="toggle-stubs">
          <input type="checkbox" id="show-stubs"> Show stubs
        </label>
      </div>
      <div id="skills-list"></div>
    </main>
  </div>
</div>

<div id="maintain-view" class="view-hidden">
  <div class="maintain-stats" id="maintain-stats"></div>
  <div class="maintain-toolbar">
    <input type="text" id="maintain-search" placeholder="Search by name or path...">
    <label><input type="checkbox" id="filter-broken"> Broken only</label>
    <label><input type="checkbox" id="filter-duplicates"> Duplicates only</label>
    <label><input type="checkbox" id="filter-stale"> Stale only (&gt;60 days)</label>
    <span id="maintain-results-count"></span>
  </div>
  <div class="maintain-table-wrap">
    <div class="maintain-path-caption" id="maintain-path-caption"></div>
    <table id="maintain-table">
      <thead>
        <tr>
          <th data-sort="name">Name<span class="sort-arrow"></span></th>
          <th data-sort="truePath">True Path<span class="sort-arrow"></span></th>
          <th data-sort="lastModified">Last Modified<span class="sort-arrow"></span></th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="maintain-tbody"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  let DATA = null;
  const activeFilters = { type: new Set(), phase: new Set(), stage: new Set(), tool: new Set(), role: new Set(), task: new Set() };
  let searchQuery = "";
  let showStubs = false;

  const GROUP_LABELS = { type: "Skill Type", phase: "Agile Phase", stage: "Work Stage", tool: "Tool", role: "Role", task: "Task Type" };

  const PHASE_LABELS = {
    "planning": "Planning (future-looking)",
    "in-progress": "In Progress (current status)",
    "retrospective": "Retrospective (looking back)",
  };

  const STAGE_LABELS = {
    "gather": "Gather (context-gathering)",
    "produce": "Produce (the actual work)",
    "reflect": "Reflect (retrospective insight)",
  };

  let currentView = "browse";
  const maintainFilters = { search: "", broken: false, duplicates: false, stale: false };
  // Sort state for the Maintain Skills table. column is one of
  // "name" | "truePath" | "lastModified" | null (unsorted/insertion order).
  const maintainSort = { column: null, direction: "asc" };
  let homePathPrefix = "";

  // Home-directory prefix stripped from every True Path shown in the Maintain
  // view. This is intentionally STATIC: computed ONCE from the full inventory
  // (not re-derived from whatever rows happen to be currently filtered/
  // visible), and it never changes as the user searches or toggles filters.
  // Entries in this dataset are a mix of paths rooted under both
  // "/Users/<home>/AI Assets/..." (symlinked farm entries) and
  // "/Users/<home>/.agents/skills/..." (real, non-symlinked directories),
  // which share no deeper common ancestor than the home directory itself --
  // so dynamically extending the stripped prefix based on a filtered subset
  // doesn't generalize sensibly. The home directory is detected from the
  // OS-style "/Users/<user>/" (macOS) or "/home/<user>/" (Linux) prefix on
  // any real path, rather than hardcoding a username.
  function computeHomePrefix(inventory) {
    for (const e of inventory) {
      const m = (e.truePath || "").match(/^(\/Users\/[^/]+\/|\/home\/[^/]+\/)/);
      if (m) return m[1];
    }
    return "";
  }

  function displayPath(truePath) {
    const path = truePath || "";
    return homePathPrefix && path.startsWith(homePathPrefix)
      ? path.slice(homePathPrefix.length)
      : path;
  }

  async function init() {
    // cache: "no-store" + a cache-busting query param, because python's
    // http.server sends no Cache-Control header, so browsers can silently
    // serve a stale skills.json from disk cache even on a normal reload.
    const resp = await fetch(`skills.json?_=${Date.now()}`, { cache: "no-store" });
    DATA = await resp.json();
    document.getElementById("header-stats").innerHTML =
      `<strong>${DATA.skillCount}</strong> skills &middot; <strong>${DATA.activeCount}</strong> active &middot; <strong>${DATA.stubCount}</strong> stubs`;
    // Computed once, over the full inventory, regardless of filters -- see
    // computeHomePrefix() for why this is intentionally static.
    homePathPrefix = computeHomePrefix(DATA.inventory || []);
    loadFiltersFromHash();
    renderSidebar();
    renderSkills();
    renderMaintainStats();
    renderMaintain();
    bindEvents();
  }

  function renderSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = "";
    for (const [group, label] of Object.entries(GROUP_LABELS)) {
      const options = DATA.filterOptions[group];
      const div = document.createElement("div");
      div.className = "filter-group";
      div.dataset.group = group;

      const counts = {};
      for (const opt of options) {
        counts[opt] = DATA.skills.filter(s =>
          s.tags[group].includes(opt) && (showStubs || s.status !== "stub")
        ).length;
      }

      div.innerHTML = `
        <div class="filter-group-header">
          <span>${label}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="filter-options">
          ${options.map(opt => `
            <label class="filter-option">
              <input type="checkbox" data-group="${group}" data-value="${opt}"
                ${activeFilters[group].has(opt) ? "checked" : ""}>
              <span>${formatLabel(opt, group)}</span>
              <span class="count">${counts[opt]}</span>
            </label>
          `).join("")}
        </div>
      `;
      sidebar.appendChild(div);

      div.querySelector(".filter-group-header").addEventListener("click", () => {
        div.classList.toggle("collapsed");
      });
    }
  }

  function renderSkills() {
    const list = document.getElementById("skills-list");
    list.innerHTML = "";
    let visibleCount = 0;

    for (const skill of DATA.skills) {
      const matchesFilters = matchesActiveFilters(skill);
      const matchesSearch = matchesSearchQuery(skill);
      const isStub = skill.status === "stub";
      const visible = matchesFilters && matchesSearch && (showStubs || !isStub);

      if (visible) visibleCount++;

      const card = document.createElement("details");
      card.className = `skill-card${isStub ? " stub" : ""}${!visible ? " hidden" : ""}`;
      card.dataset.id = skill.id;

      const allTags = [
        ...(skill.tags.phase || []).map(t => ({ group: "phase", value: t })),
        ...(skill.tags.stage || []).map(t => ({ group: "stage", value: t })),
        ...skill.tags.tool.map(t => ({ group: "tool", value: t })),
        ...skill.tags.role.map(t => ({ group: "role", value: t })),
        ...skill.tags.task.map(t => ({ group: "task", value: t })),
      ];

      const isWorkflow = skill.skillType === "workflow";
      const inputs = skill.inputs || [];
      const requiredSkills = skill.requiredSkills || [];
      const trigger = skill.trigger || "";

      card.innerHTML = `
        <summary>
          <div class="summary-text">
            <span class="skill-name">${escapeHtml(skill.displayName)}</span>
            <span class="skill-description-preview">${escapeHtml(skill.description)}</span>
          </div>
        </summary>
        <div class="skill-details">
          <div class="skill-tags">
            <span class="skill-type-badge ${isWorkflow ? "workflow" : "atomic"}">${isWorkflow ? "Workflow" : "Atomic"}</span>
            ${allTags.map(t =>
              `<span class="tag ${t.group}" data-group="${t.group}" data-value="${t.value}">${formatLabel(t.value, t.group)}</span>`
            ).join("")}
          </div>
          <div class="meta-row">
            <span><strong>Module:</strong> ${escapeHtml(skill.moduleDisplay)}</span>
            ${skill.owningAgent ? `<span><strong>Agent:</strong> ${escapeHtml(skill.owningAgent)}</span>` : ""}
            <span><strong>ID:</strong> <code>${escapeHtml(skill.id)}</code></span>
          </div>
          <div class="how-to-use">
            ${trigger ? `
              <div class="block">
                <h4>When to use</h4>
                <p>${escapeHtml(trigger)}</p>
              </div>
            ` : ""}
            ${inputs.length ? `
              <div class="block">
                <h4>Inputs</h4>
                <ul class="inputs-list">
                  ${inputs.map(i => `<li class="${i.required ? "required" : ""}" title="${i.required ? "Required" : "Optional"}">${escapeHtml(i.name)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
            ${requiredSkills.length ? `
              <div class="block">
                <h4>Runs these skills in order</h4>
                <div class="required-skills-chain">
                  ${requiredSkills.map((s, i) =>
                    `${i > 0 ? '<span class="arrow-sep">&rarr;</span>' : ""}<span class="step"><button class="step-link" data-jump="${escapeHtml(s.id)}" title="${escapeHtml(s.label)}">${escapeHtml(s.label)}</button></span>`
                  ).join("")}
                </div>
              </div>
            ` : ""}
            <div class="block">
              <span class="source-path">${escapeHtml(skill.sourcePath || "")}</span>
            </div>
          </div>
        </div>
      `;

      list.appendChild(card);
    }

    document.getElementById("results-count").textContent =
      `Showing ${visibleCount} of ${DATA.skillCount} skills`;

    if (visibleCount === 0) {
      const msg = document.createElement("div");
      msg.className = "no-results";
      msg.textContent = "No skills match the current filters.";
      list.appendChild(msg);
    }

    renderActiveFiltersBar();
  }

  function renderActiveFiltersBar() {
    const bar = document.getElementById("active-filters-bar");
    const chips = document.getElementById("filter-chips");
    const hasFilters = Object.values(activeFilters).some(s => s.size > 0);
    bar.classList.toggle("visible", hasFilters);
    chips.innerHTML = "";
    for (const [group, values] of Object.entries(activeFilters)) {
      for (const val of values) {
        const chip = document.createElement("button");
        chip.className = "filter-chip";
        chip.dataset.group = group;
        chip.dataset.value = val;
        chip.innerHTML = `${formatLabel(val, group)} <span class="remove">×</span>`;
        chip.addEventListener("click", () => {
          activeFilters[group].delete(val);
          const cb = document.querySelector(`input[data-group="${group}"][data-value="${val}"]`);
          if (cb) cb.checked = false;
          updateHashFromFilters();
          renderSkills();
        });
        chips.appendChild(chip);
      }
    }
  }

  function switchView(view) {
    currentView = view;
    document.getElementById("browse-view").classList.toggle("view-hidden", view !== "browse");
    document.getElementById("maintain-view").classList.toggle("view-hidden", view !== "maintain");
    document.getElementById("search-box").classList.toggle("view-hidden", view !== "browse");
    document.querySelectorAll(".view-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === view);
    });
    if (view === "maintain") renderMaintain();
  }

  function renderMaintainStats() {
    const s = DATA.inventoryStats || {};
    const stats = document.getElementById("maintain-stats");
    const items = [
      ["total", "Total farm entries"],
      ["broken", "Broken symlinks", "stat-broken"],
      ["duplicateIssues", "Duplicate issues", "stat-duplicates"],
      ["stale", `Stale (>${s.staleThresholdDays || 60}d)`, "stat-stale"],
      ["fresh", "Fresh"],
      ["inCuratedView", "In Browse view"],
      ["notInCuratedView", "Not in Browse view"],
    ];
    stats.innerHTML = items.map(([key, label, cls]) => `
      <div class="maintain-stat ${cls || ""}">
        <strong>${s[key] ?? 0}</strong>
        <span>${label}</span>
      </div>
    `).join("");
  }

  // Sorts an already-filtered array of inventory rows according to
  // maintainSort. Called fresh on every renderMaintain() so sort order is
  // re-applied on top of whatever filters/search are currently active,
  // rather than being computed once and going stale.
  function sortMaintainRows(rows) {
    const { column, direction } = maintainSort;
    if (!column) return rows;
    const dir = direction === "asc" ? 1 : -1;
    return rows.slice().sort((a, b) => {
      if (column === "name") {
        return dir * a.name.toLowerCase().localeCompare(b.name.toLowerCase());
      }
      if (column === "truePath") {
        // Sort by the full, real truePath -- not displayPath()'s shortened
        // version -- so ordering is stable regardless of display formatting.
        return dir * (a.truePath || "").toLowerCase().localeCompare((b.truePath || "").toLowerCase());
      }
      if (column === "lastModified") {
        const aDate = a.skillMdModified;
        const bDate = b.skillMdModified;
        // Entries with no date (e.g. missing SKILL.md) aren't comparable --
        // always push them to the end, regardless of sort direction.
        if (!aDate && !bDate) return 0;
        if (!aDate) return 1;
        if (!bDate) return -1;
        // skillMdModified is an ISO "YYYY-MM-DD" string, which sorts
        // correctly with plain string comparison -- compare it directly
        // rather than the derived daysSinceModified integer, which rounds
        // to whole days and can tie two different actual dates together.
        return dir * aDate.localeCompare(bDate);
      }
      return 0;
    });
  }

  // Updates the small ↑/↓ indicator next to whichever Maintain table header
  // is currently the active sort column; clears it from the others.
  function updateSortIndicators() {
    document.querySelectorAll("#maintain-table th[data-sort]").forEach(th => {
      const arrow = th.querySelector(".sort-arrow");
      if (!arrow) return;
      arrow.textContent = th.dataset.sort === maintainSort.column
        ? (maintainSort.direction === "asc" ? " \u2191" : " \u2193")
        : "";
    });
  }

  function renderMaintain() {
    const tbody = document.getElementById("maintain-tbody");
    const inventory = DATA.inventory || [];
    const q = maintainFilters.search.toLowerCase();

    let rows = inventory.filter(e => {
      if (maintainFilters.broken && !e.broken) return false;
      if (maintainFilters.duplicates && !e.hasDuplicateIssue) return false;
      if (maintainFilters.stale && !(e.daysSinceModified != null && e.daysSinceModified > (DATA.inventoryStats?.staleThresholdDays || 60))) return false;
      if (q && !e.name.toLowerCase().includes(q) && !(e.truePath || "").toLowerCase().includes(q)) return false;
      return true;
    });

    rows = sortMaintainRows(rows);

    // Static caption -- always reflects the once-computed home directory
    // prefix, never the current filters (see computeHomePrefix()).
    const caption = document.getElementById("maintain-path-caption");
    caption.innerHTML = homePathPrefix
      ? `True Path shown relative to <code>${escapeHtml(homePathPrefix)}</code>`
      : "";

    updateSortIndicators();

    tbody.innerHTML = rows.map(e => {
      const staleThreshold = DATA.inventoryStats?.staleThresholdDays || 60;
      const isStale = e.daysSinceModified != null && e.daysSinceModified > staleThreshold;

      let dateCell;
      if (!e.hasSkillMd) {
        dateCell = `<div class="maintain-date unknown">No SKILL.md</div>`;
      } else {
        const daysText = e.daysSinceModified != null ? `(${e.daysSinceModified}d ago)` : "";
        dateCell = `
          <div class="maintain-date ${isStale ? "stale" : ""}">${escapeHtml(e.skillMdModified || "unknown")}</div>
          ${daysText ? `<div class="maintain-days-ago ${isStale ? "stale" : ""}">${daysText}</div>` : ""}
        `;
      }

      const badges = [];
      if (!e.isSymlink) badges.push(`<span class="badge badge-realdir">Real dir</span>`);
      if (e.broken) badges.push(`<span class="badge badge-broken">Broken symlink</span>`);
      if (!e.hasSkillMd && !e.broken) badges.push(`<span class="badge badge-missing">No SKILL.md</span>`);
      if (e.hasDuplicateIssue) {
        const details = [
          ...e.duplicates.redundantSymlinks.map(n => `also symlinked as: ${n}`),
          ...e.duplicates.nameCollisions.map(n => `name collision with: ${n}`),
        ].join("; ");
        badges.push(`<span class="badge badge-duplicate" title="${escapeHtml(details)}">Duplicate</span>`);
      }
      if (isStale) badges.push(`<span class="badge badge-stale">Stale</span>`);
      badges.push(e.inCuratedView
        ? `<span class="badge badge-curated">In Browse view</span>`
        : `<span class="badge badge-orphaned">Not in Browse view</span>`);

      return `
        <tr>
          <td class="maintain-name">${escapeHtml(e.name)}</td>
          <td class="maintain-path">${escapeHtml(displayPath(e.truePath))}</td>
          <td>${dateCell}</td>
          <td>${badges.join("")}</td>
        </tr>
      `;
    }).join("");

    document.getElementById("maintain-results-count").textContent =
      `Showing ${rows.length} of ${inventory.length} entries`;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="no-results">No entries match the current filters.</td></tr>`;
    }
  }

  function matchesActiveFilters(skill) {
    for (const [group, selected] of Object.entries(activeFilters)) {
      if (selected.size === 0) continue;
      const skillTags = skill.tags[group] || [];
      if (!skillTags.some(t => selected.has(t))) return false;
    }
    return true;
  }

  function matchesSearchQuery(skill) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (
      skill.id.toLowerCase().includes(q) ||
      skill.displayName.toLowerCase().includes(q) ||
      skill.description.toLowerCase().includes(q) ||
      skill.moduleDisplay.toLowerCase().includes(q) ||
      skill.owningAgent.toLowerCase().includes(q) ||
      (skill.trigger || "").toLowerCase().includes(q)
    );
  }

  function jumpToSkill(id) {
    // Clear filters/search that would hide the target skill, then scroll to and open it.
    searchQuery = "";
    document.getElementById("search-box").value = "";
    for (const set of Object.values(activeFilters)) set.clear();
    document.querySelectorAll(".sidebar input[type=checkbox]").forEach(cb => cb.checked = false);
    updateHashFromFilters();
    renderSkills();
    const target = document.querySelector(`.skill-card[data-id="${CSS.escape(id)}"]`);
    if (target) {
      target.open = true;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.style.outline = "2px solid var(--tag-tool)";
      setTimeout(() => { target.style.outline = ""; }, 1500);
    }
  }

  function bindEvents() {
    document.getElementById("sidebar").addEventListener("change", (e) => {
      if (e.target.type !== "checkbox") return;
      const { group, value } = e.target.dataset;
      if (e.target.checked) {
        activeFilters[group].add(value);
      } else {
        activeFilters[group].delete(value);
      }
      updateHashFromFilters();
      renderSkills();
    });

    document.getElementById("skills-list").addEventListener("click", (e) => {
      const jumpBtn = e.target.closest(".step-link");
      if (jumpBtn) {
        e.preventDefault();
        e.stopPropagation();
        jumpToSkill(jumpBtn.dataset.jump);
        return;
      }
      const tag = e.target.closest(".tag");
      if (!tag) return;
      e.preventDefault();
      e.stopPropagation();
      const { group, value } = tag.dataset;
      if (activeFilters[group].has(value)) {
        activeFilters[group].delete(value);
      } else {
        activeFilters[group].add(value);
      }
      const cb = document.querySelector(`input[data-group="${group}"][data-value="${value}"]`);
      if (cb) cb.checked = activeFilters[group].has(value);
      updateHashFromFilters();
      renderSkills();
    });

    document.getElementById("clear-all-btn").addEventListener("click", () => {
      for (const set of Object.values(activeFilters)) set.clear();
      document.querySelectorAll(".sidebar input[type=checkbox]").forEach(cb => cb.checked = false);
      updateHashFromFilters();
      renderSkills();
    });

    document.getElementById("search-box").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderSkills();
    });

    document.getElementById("show-stubs").addEventListener("change", (e) => {
      showStubs = e.target.checked;
      renderSidebar();
      renderSkills();
    });

    document.getElementById("view-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".view-tab");
      if (!btn) return;
      switchView(btn.dataset.view);
    });

    document.getElementById("maintain-search").addEventListener("input", (e) => {
      maintainFilters.search = e.target.value.trim();
      renderMaintain();
    });

    document.getElementById("filter-broken").addEventListener("change", (e) => {
      maintainFilters.broken = e.target.checked;
      renderMaintain();
    });

    document.getElementById("filter-duplicates").addEventListener("change", (e) => {
      maintainFilters.duplicates = e.target.checked;
      renderMaintain();
    });

    document.getElementById("filter-stale").addEventListener("change", (e) => {
      maintainFilters.stale = e.target.checked;
      renderMaintain();
    });

    document.querySelectorAll("#maintain-table th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.sort;
        if (maintainSort.column === col) {
          maintainSort.direction = maintainSort.direction === "asc" ? "desc" : "asc";
        } else {
          maintainSort.column = col;
          maintainSort.direction = "asc";
        }
        renderMaintain();
      });
    });
  }

  function updateHashFromFilters() {
    const parts = [];
    for (const [group, values] of Object.entries(activeFilters)) {
      if (values.size > 0) {
        parts.push(`${group}=${[...values].join(",")}`);
      }
    }
    window.location.hash = parts.length ? parts.join("&") : "";
  }

  function loadFiltersFromHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    for (const part of hash.split("&")) {
      const [group, vals] = part.split("=");
      if (activeFilters[group] && vals) {
        for (const v of vals.split(",")) {
          if (DATA.filterOptions[group]?.includes(v)) {
            activeFilters[group].add(v);
          }
        }
      }
    }
  }

  function formatLabel(slug, group) {
    if (group === "phase" && PHASE_LABELS[slug]) return PHASE_LABELS[slug];
    if (group === "stage" && STAGE_LABELS[slug]) return STAGE_LABELS[slug];
    return slug.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  init();
})();
</script>

</body>
</html>
